<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبحة</title>
<style>
body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  margin: 0;
}
.card {
  background: white;
  width: 320px;
  padding: 30px;
  border-radius: 30px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}
h1 { color: #2c5364; margin: 0; font-size: 32px; }
p { color: #888; margin: 5px 0 20px; }
.counter {
  font-size: 90px;
  font-weight: bold;
  color: #0f2027;
  margin: 10px 0;
}
button.main {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #11998e, #38ef7d);
  color: white;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(56,239,125,0.4);
  transition: 0.1s;
}
button.main:active { transform: scale(0.92); }
.reset {
  margin-top: 20px;
  background: none;
  border: none;
  color: #aaa;
  cursor: pointer;
  font-size: 14px;
}
.progress {
  height: 8px;
  background: #eee;
  border-radius: 10px;
  margin-top: 20px;
  overflow: hidden;
}
.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #11998e, #38ef7d);
  transition: 0.3s;
}
</style>
</head>
<body>
<div class="card">
  <h1 id="zekr">سبحان الله</h1>
  <p>سبحة</p>
  <div class="counter" id="count">0</div>
  <button class="main" onclick="tasbeh()">سبّح</button>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <button class="reset" onclick="reset()">إعادة ↺</button>
</div>

<script>
let count = 0;
let zekrIndex = 0;
let azkar = ["سبحان الله", "الحمد لله", "الله أكبر"];

function tasbeh() {
  count++;
  if(count > 33) {
    count = 1;
    zekrIndex = (zekrIndex + 1) % 3;
    document.getElementById("zekr").innerText = azkar[zekrIndex];
  }
  document.getElementById("count").innerText = count;
  document.getElementById("bar").style.width = (count/33*100) + "%";
  if(navigator.vibrate) navigator.vibrate(50);
}

function reset() {
  count = 0;
  document.getElementById("count").innerText = 0;
  document.getElementById("bar").style.width = "0%";
}
</script>
</body>
</html>
